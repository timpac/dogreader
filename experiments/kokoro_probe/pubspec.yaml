name: kokoro_probe
description: Isolated Dogreader offline Kokoro feasibility experiment.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sherpa_onnx: 2.0.1
  archive: 4.0.9
  crypto: 3.0.7
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - passage.txt
    - model-manifest.json
    - fp32-model-manifest.json
    - comparison-passage.txt
    - english-frontend-manifest.json
    - frontend-notices.txt

name: Publish verified build 132
on:
  push:
    branches: [build/132-audio-diagnostics]
    paths: [.github/workflows/publish-132.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const release = (await github.rest.repos.getRelease({owner, repo, release_id: 432041059})).data;
            if (release.tag_name !== 'dogreader-132-audio-diagnostics' ||
                release.target_commitish !== '5581b47d61c7da5f3d10786eb3b1682ec5f66d25') {
              throw new Error('Release identity mismatch');
            }
            const asset = release.assets.find(a => a.id === 703405583);
            if (!asset || asset.name !== 'Dogreader-132-audio-diagnostics.apk' ||
                asset.size !== 171385855 || asset.state !== 'uploaded') {
              throw new Error('Verified APK missing or changed');
            }
            const result = (await github.rest.repos.updateRelease({
              owner, repo, release_id: release.id, draft: false, make_latest: 'true'
            })).data;
            core.notice(result.html_url);

name: Dogreader 118 validation

on:
  pull_request:
    branches: [release/114-plus-improvements]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Restore original signing key
        run: |
          test -n "$DOGREADER_KEYSTORE_B64" || { echo "::error::Original signing secret missing"; exit 1; }
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
      - name: Install dependencies
        run: flutter pub get
      - name: Flutter static analysis
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build original-key update APK
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --build-number 118
      - name: Verify original signing certificate and version
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/dogreader-118-certificates.txt
          grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/dogreader-118-certificates.txt || { echo "::error::Wrong signing key"; exit 1; }
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" dump badging "$APK" | grep -E "package: name='com.example.audiobook_app' versionCode='118'" || { echo "::error::Wrong application ID or version code"; exit 1; }
      - name: Save verified Dogreader update APK
        uses: actions/upload-artifact@v4
        with:
          name: Dogreader-118-original-key
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

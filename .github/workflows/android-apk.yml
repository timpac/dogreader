name: Build Dogreader Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - build/audio-controls-126
    paths:
      - 'lib/**'
      - 'test/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  dogreader-update:
    # GitHub Releases and their assets require contents: write; no other scopes.
    permissions:
      contents: write
    concurrency:
      group: dogreader-audio-controls-126
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Same package/signing identity; updates build 125 in place.
      DOGREADER_BUILD_NUMBER: '126'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check signing secret
        id: signing
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          if [ -n "$DOGREADER_KEYSTORE_B64" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Original signing key is missing; refusing to build."
            exit 1
          fi

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo docker system prune -af || true
          df -h /

      - name: Install Java 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        if: steps.signing.outputs.available == 'true'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false

      - name: Resolve Flutter dependencies
        if: steps.signing.outputs.available == 'true'
        run: flutter pub get --enforce-lockfile

      - name: Analyze Dart code
        if: steps.signing.outputs.available == 'true'
        run: flutter analyze

      - name: Run regression tests
        if: steps.signing.outputs.available == 'true'
        run: flutter test --reporter expanded

      - name: Restore original Chromebook debug signing key
        if: steps.signing.outputs.available == 'true'
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee /tmp/dogreader-keystore.txt
          if ! grep -Fqi 'C5:CC:08:D9:75:7C:0E:92:89:3A:71:62:04:A2:6F:EB:61:57:F5:35:0A:00:DB:B0:B7:96:20:49:D6:D9:D1:77' /tmp/dogreader-keystore.txt; then
            echo "::error::Wrong signing key restored."
            exit 1
          fi

      - name: Build original-app update APK
        if: steps.signing.outputs.available == 'true'
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --build-number "$DOGREADER_BUILD_NUMBER" --dart-define="DOGREADER_BUILD=$DOGREADER_BUILD_NUMBER"

      - name: Verify update signing certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          set -o pipefail
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-debug.apk | tee /tmp/dogreader-apk-certificates.txt
          if ! grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/dogreader-apk-certificates.txt; then
            echo "::error::Original Dogreader signing fingerprint mismatch; update APK will not be published."
            exit 1
          fi

      - name: Verify APK identity and version
        if: steps.signing.outputs.available == 'true'
        run: |
          AAPT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-debug.apk > /tmp/dogreader-apk-badging.txt
          head -1 /tmp/dogreader-apk-badging.txt
          grep -Fq "package: name='com.example.audiobook_app' versionCode='$DOGREADER_BUILD_NUMBER'" /tmp/dogreader-apk-badging.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload verified APK to private draft GitHub Release
        id: draft_release
        if: steps.signing.outputs.available == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const source = 'build/app/outputs/flutter-apk/app-debug.apk';
            const name = 'Dogreader-126-audio-controls-white-theme.apk';
            const title = 'Dogreader 126 audio controls with white theme';
            const preferredTag = 'dogreader-126-audio-controls';
            const data = fs.readFileSync(source);
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            const expected = digest(data);
            const fail = message => { throw new Error(message); };
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            let release = releases.find(item => item.tag_name === preferredTag);
            if (!release) {
              const named = releases.filter(item => item.name === title);
              if (named.length > 1) fail(`Multiple ${title} releases exist; refusing an ambiguous upload.`);
              release = named[0];
            }
            const tag = release?.tag_name ?? preferredTag;
            let tagCommit;
            let tagRef;
            try {
              tagRef = (await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (tagRef) {
              let object = tagRef.object;
              for (let depth = 0; object.type === 'tag' && depth < 8; depth++) {
                object = (await github.rest.git.getTag({ owner, repo, tag_sha: object.sha })).data.object;
              }
              if (object.type !== 'commit' || object.sha !== context.sha) {
                fail(`Tag ${tag} does not point to this workflow commit; it will not be moved or overwritten.`);
              }
              tagCommit = object.sha;
            }
            const assertDraft = item => {
              if (!item.draft || item.name !== title || item.tag_name !== tag) {
                fail('The existing release is public or has conflicting metadata; refusing to modify it.');
              }
              if (item.target_commitish !== context.sha && tagCommit !== context.sha) {
                fail('The existing draft targets another commit; refusing to attach a different build.');
              }
            };
            if (release) {
              assertDraft(release);
            } else {
              release = (await github.rest.repos.createRelease({
                owner, repo, tag_name: tag, target_commitish: context.sha, name: title,
                draft: true, prerelease: false, make_latest: 'false',
                body: `Build 126, original Dogreader signing identity.\n\nSource: ${context.sha}\nBase: build-125 white theme (701f349ad635d7d042208e83ce902477de225d85); audio fixes/tests from PR #13 (90d34cfd026c9ea20172724e0b775f49b4cafa79). Theme branches unchanged.\nWorkflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\nFull analysis, combined regression tests, APK signature and package/version checks passed. PR #13 passed 12 native control checks on Android 13; the reported Pixel 8 Pro/possible Android 17 beta symptom still needs device verification. Install over build 125 without uninstalling or clearing storage.`
              })).data;
              assertDraft(release);
            }
            // Never publish a release or replace any existing asset, including on reruns.
            release = (await github.rest.repos.getRelease({ owner, repo, release_id: release.id })).data;
            assertDraft(release);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id: release.id, per_page: 100 });
            let asset = assets.find(item => item.name === name);
            if (!asset) {
              fs.copyFileSync(source, `build/app/outputs/flutter-apk/${name}`);
              asset = (await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name, data,
                headers: { 'content-type': 'application/vnd.android.package-archive', 'content-length': data.length }
              })).data;
            }
            if (asset.state !== 'uploaded' || asset.size !== data.length) {
              fail(`Asset ${name} is incomplete or conflicts with this APK; no assets were overwritten.`);
            }
            const downloaded = await github.rest.repos.getReleaseAsset({
              owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' }
            });
            const received = Buffer.from(downloaded.data);
            if (digest(received) !== expected) {
              fail(`Asset ${name} has different bytes; no assets were overwritten.`);
            }
            release = (await github.rest.repos.getRelease({ owner, repo, release_id: release.id })).data;
            assertDraft(release);
            core.setOutput('release_url', release.html_url);
            core.setOutput('release_id', release.id);
            core.setOutput('asset_id', asset.id);
            core.notice(`Verified draft APK ready: ${release.html_url} (asset ${asset.id}, SHA-256 ${expected})`);
            await core.summary.addHeading('Verified draft APK ready')
              .addLink(title, release.html_url)
              .addTable([
                [{ data: 'APK', header: true }, { data: 'Value', header: true }],
                ['Filename', name], ['Version code', process.env.DOGREADER_BUILD_NUMBER], ['Package', 'com.example.audiobook_app'],
                ['Source commit', context.sha], ['Asset ID', String(asset.id)], ['APK SHA-256', expected],
                ['Release visibility', 'Draft; not published']
              ]).write();

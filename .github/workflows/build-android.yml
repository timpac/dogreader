name: Build Dogreader APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reader-pagination-scene-breaks
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Restore original Android debug signing key
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DOGREADER_KEYSTORE_B64" ]; then
            echo "::error::DOGREADER_KEYSTORE_B64 secret is missing or empty"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android >/dev/null
          echo "Original debug signing key restored and validated"
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Name APK from pubspec version
        run: |
          BUILD_NUMBER=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-debug.apk "Dogreader-${BUILD_NUMBER}.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dogreader-APK
          path: Dogreader-*.apk
          if-no-files-found: error
          retention-days: 30

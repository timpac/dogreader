name: Build Dogreader APK

on:
  workflow_dispatch:
  push:
    branches:
      - fix/reader-pagination-scene-breaks
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Free disk space for Android build
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk /usr/local/lib/android/sdk/cmake
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell /usr/local/lib/node_modules
          sudo docker system prune -af || true
          df -h /
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Restore original Android debug signing key
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$DOGREADER_KEYSTORE_B64" ]; then
            echo "::error::DOGREADER_KEYSTORE_B64 secret is missing or empty"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android >/dev/null
          FINGERPRINT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          EXPECTED="c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177"
          if [ "$FINGERPRINT" != "$EXPECTED" ]; then
            echo "::error::Signing certificate does not match installed Dogreader"
            exit 1
          fi
          echo "Verified signing key matches Dogreader build 114"
      - name: Fetch dependencies
        run: flutter pub get
      - name: Build debug APK
        env:
          DOGREADER_SIGNING_KEYSTORE: ${{ github.workspace }}/.dogreader-original-debug.keystore
        run: |
          cp "$HOME/.android/debug.keystore" "$DOGREADER_SIGNING_KEYSTORE"
          flutter build apk --debug
      - name: Verify built APK signing certificate
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android apksigner not found"
            exit 1
          fi
          "$APKSIGNER" verify "$APK"
          "$APKSIGNER" verify --print-certs "$APK"
          ACTUAL=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest:[[:space:]]*//p' | head -1 | tr -d '\r[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED=c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177
          echo "Built APK certificate SHA-256: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Built APK signature does not match installed Dogreader"
            exit 1
          fi
          echo "APK signature verified against installed Dogreader"
      - name: Name APK from pubspec version
        run: |
          BUILD_NUMBER=$(sed -n 's/^version: .*+//p' pubspec.yaml)
          cp build/app/outputs/flutter-apk/app-debug.apk "Dogreader-${BUILD_NUMBER}.apk"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Dogreader-APK
          path: Dogreader-*.apk
          if-no-files-found: error
          retention-days: 30

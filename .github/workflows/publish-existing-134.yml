name: Publish exact existing Build 134 under v134
on:
  workflow_dispatch:
  push:
    branches: [delivery/build-134-release]
    paths: ['.github/workflows/publish-existing-134.yml']
permissions:
  contents: write
jobs:
  publish-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      APK_SHA256: 1ad73080de73ee04e83dd3d002a8890f25fec404306e1337510648632fc8d5f9
    steps:
      - name: Retrieve existing verified binary, without rebuilding or signing
        run: |
          gh api repos/timpac/dogreader/releases/assets/713814592 -H 'Accept: application/octet-stream' > /tmp/Dogreader-134.apk
          printf '%s  %s\n' "$APK_SHA256" /tmp/Dogreader-134.apk | sha256sum --check --strict
      - name: Upload unchanged APK, verify download, then publish v134
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const releaseId = 435395536;
            const expected = process.env.APK_SHA256;
            const source = 'ebffd30cc20932c7dc5bee2b93f4efe9461ca6c0';
            const name = 'Dogreader-134.apk';
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            let release = (await github.rest.repos.getRelease({owner, repo, release_id: releaseId})).data;
            if (release.tag_name !== 'v134' || release.target_commitish !== source) throw new Error('Unexpected release target; refusing to modify it.');
            const bytes = fs.readFileSync('/tmp/Dogreader-134.apk');
            if (hash(bytes) !== expected) throw new Error('Original APK checksum mismatch.');
            const assets = (await github.rest.repos.listReleaseAssets({owner, repo, release_id: releaseId})).data;
            let asset = assets.find(a => a.name === name);
            if (!asset) {
              if (!release.draft) throw new Error('Refusing to upload into a previously published release.');
              asset = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: releaseId, name, data: bytes,
                headers: {'content-type': 'application/vnd.android.package-archive', 'content-length': bytes.length}})).data;
            }
            if (asset.state !== 'uploaded' || asset.size !== bytes.length) throw new Error('Incomplete or conflicting asset.');
            const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id,
              headers: {accept: 'application/octet-stream'}});
            if (hash(Buffer.from(downloaded.data)) !== expected) throw new Error('Downloaded asset differs from verified Build 134.');
            if (release.draft) {
              release = (await github.rest.repos.updateRelease({owner, repo, release_id: releaseId,
                tag_name: 'v134', target_commitish: source, name: 'Dogreader 134',
                draft: false, prerelease: false, make_latest: 'true'})).data;
            }
            const final = (await github.rest.repos.getRelease({owner, repo, release_id: releaseId})).data;
            const finalAsset = final.assets.find(a => a.id === asset.id);
            if (final.draft || final.tag_name !== 'v134' || !finalAsset) throw new Error('Release publication did not complete.');
            core.notice(`Verified APK download: ${finalAsset.browser_download_url}`);
            await core.summary.addHeading('Existing Build 134 APK published; no rebuild or re-signing')
              .addLink('Download Dogreader-134.apk', finalAsset.browser_download_url)
              .addRaw(`\n\nSHA-256: ${expected}\n\nOriginal signature is preserved by byte-identical delivery.`).write();

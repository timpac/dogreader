name: System media control regression tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: media-controls-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze current app and controls
        run: flutter analyze
      - name: Run all regression tests without signing or cloud credentials
        run: flutter test --reporter expanded

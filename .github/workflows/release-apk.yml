name: Release Dogreader APK

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Reviewed full source SHA reachable from the selected authorized branch
        required: true
        type: string
      build_number:
        description: New unused sequential Android versionCode above all existing APKs
        required: true
        type: string
      publish:
        description: Publish after verification; false retains a draft for review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: dogreader-apk-release
  cancel-in-progress: false

jobs:
  apk:
    if: (github.ref == 'refs/heads/dogreader-oct22-update' || github.ref == 'refs/heads/fix/156-progress-persistence' || github.ref == 'refs/heads/fix/160-epub-narration' || github.ref == 'refs/heads/build/161-chapter-narration' || github.ref == 'refs/heads/build/162-narration-queue-reliability' || github.ref == 'refs/heads/build/163-chapter-panel-refinement' || github.ref == 'refs/heads/build/163-tts-cost-tracker' || github.ref == 'refs/heads/build/164-light-mode-cost-tracker' || github.ref == 'refs/heads/build/165-rss-offline-kokoro' || github.ref == 'refs/heads/build/166-ai-article-summaries' || github.ref == 'refs/heads/build/167-kokoro-decoder-fix') && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Require canonical branch, reviewed SHA and unused number
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const metadata = (await github.rest.repos.get({owner, repo})).data;
            const allowedRefs = new Set([
              'refs/heads/dogreader-oct22-update',
              'refs/heads/fix/156-progress-persistence',
              'refs/heads/fix/160-epub-narration',
              'refs/heads/build/161-chapter-narration',
              'refs/heads/build/162-narration-queue-reliability',
              'refs/heads/build/163-chapter-panel-refinement',
              'refs/heads/build/163-tts-cost-tracker',
              'refs/heads/build/164-light-mode-cost-tracker',
              'refs/heads/build/165-rss-offline-kokoro',
              'refs/heads/build/166-ai-article-summaries',
              'refs/heads/build/167-kokoro-decoder-fix'
            ]);
            if (metadata.default_branch !== 'dogreader-oct22-update' || !allowedRefs.has(context.ref)) throw new Error('Authorized branch mismatch');
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect retained assets before a new explicitly authorized dispatch; do not rerun');
            if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error('Full lowercase source SHA required');
            const number = process.env.BUILD_NUMBER;
            if (context.ref === 'refs/heads/fix/160-epub-narration' && number !== '160') throw new Error('This branch is authorized for build 160 only');
            if (context.ref === 'refs/heads/build/161-chapter-narration' && number !== '161') throw new Error('This branch is authorized for build 161 only');
            if (context.ref === 'refs/heads/build/162-narration-queue-reliability' && number !== '162') throw new Error('This branch is authorized for build 162 only');
            if (context.ref === 'refs/heads/build/163-chapter-panel-refinement' && number !== '163') throw new Error('This branch is authorized for build 163 only');
            if (context.ref === 'refs/heads/build/163-tts-cost-tracker' && number !== '163') throw new Error('This branch is authorized for build 163 only');
            if (context.ref === 'refs/heads/build/164-light-mode-cost-tracker' && number !== '164') throw new Error('This branch is authorized for build 164 only');
            if (context.ref === 'refs/heads/build/165-rss-offline-kokoro' && number !== '165') throw new Error('This branch is authorized for build 165 only');
            if (context.ref === 'refs/heads/build/166-ai-article-summaries' && number !== '166') throw new Error('This branch is authorized for build 166 only');
            if (context.ref === 'refs/heads/build/167-kokoro-decoder-fix' && number !== '167') throw new Error('This branch is authorized for build 167 only');
            if (!/^[1-9][0-9]*$/.test(number) || Number(number) <= 135 || Number(number) > 2100000000) throw new Error('Invalid new Android versionCode');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            let highest = 135;
            for (const release of releases) {
              const values = [release.tag_name, ...release.assets.map(a => a.name)];
              for (const value of values) {
                const match = /^(?:v|dogreader-|build-|Dogreader-)([0-9]+)(?:$|[-.])/.exec(value);
                if (match) highest = Math.max(highest, Number(match[1]));
              }
            }
            for (const tag of tags) {
              const match = /^(?:v|dogreader-|build-)([0-9]+)(?:$|[-.])/.exec(tag.name);
              if (match) highest = Math.max(highest, Number(match[1]));
            }
            if (Number(number) !== highest + 1) throw new Error(`Next unused sequential version is ${highest + 1}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete build-135 and canonical branch ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor cdf4227dc6a966b20e24f61179ac953b22689024 HEAD
          if [ "$GITHUB_REF" = refs/heads/build/167-kokoro-decoder-fix ]; then
            git merge-base --is-ancestor b20a1a3fa19630ef02f5c6bb430557f5a5667eda HEAD
            git merge-base --is-ancestor HEAD origin/build/167-kokoro-decoder-fix
          elif [ "$GITHUB_REF" = refs/heads/build/166-ai-article-summaries ]; then
            git merge-base --is-ancestor 7a81a770cad85cfd4f7b001cc3f55d135a7f416d HEAD
            git merge-base --is-ancestor HEAD origin/build/166-ai-article-summaries
          elif [ "$GITHUB_REF" = refs/heads/build/165-rss-offline-kokoro ]; then
            git merge-base --is-ancestor 3b854fdbb5bab143de05db012d7e4f6cdd5c0253 HEAD
            git merge-base --is-ancestor HEAD origin/build/165-rss-offline-kokoro
          elif [ "$GITHUB_REF" = refs/heads/build/164-light-mode-cost-tracker ]; then
            git merge-base --is-ancestor d364a959d6d82a5698393bb0d4e23431945c4491 HEAD
            git merge-base --is-ancestor HEAD origin/build/164-light-mode-cost-tracker
          elif [ "$GITHUB_REF" = refs/heads/build/163-chapter-panel-refinement ]; then
            git merge-base --is-ancestor 28d9287b01ac84b2d3be076ce24b56ccbe594fac HEAD
            git merge-base --is-ancestor HEAD origin/build/163-chapter-panel-refinement
          elif [ "$GITHUB_REF" = refs/heads/build/163-tts-cost-tracker ]; then
            git merge-base --is-ancestor 28d9287b01ac84b2d3be076ce24b56ccbe594fac HEAD
            git merge-base --is-ancestor HEAD origin/build/163-tts-cost-tracker
          elif [ "$GITHUB_REF" = refs/heads/build/162-narration-queue-reliability ]; then
            git merge-base --is-ancestor fe31cb7a2bec8213a62a5bd62751936e645167d6 HEAD
            git merge-base --is-ancestor HEAD origin/build/162-narration-queue-reliability
          elif [ "$GITHUB_REF" = refs/heads/build/161-chapter-narration ]; then
            git merge-base --is-ancestor d6d48b3e5d079593e505003e5d312503592eb0cd HEAD
            git merge-base --is-ancestor HEAD origin/build/161-chapter-narration
          elif [ "$GITHUB_REF" = refs/heads/fix/160-epub-narration ]; then
            git merge-base --is-ancestor 145d29bb4852d390308d9e2c20c0dac49b6aaecd HEAD
            git merge-base --is-ancestor HEAD origin/fix/160-epub-narration
          elif [ "$GITHUB_REF" = refs/heads/fix/156-progress-persistence ]; then
            git merge-base --is-ancestor 47bd9a985a1bccadef07f6f2d961433a4898949c HEAD
            git merge-base --is-ancestor HEAD origin/fix/156-progress-persistence
          else
            git merge-base --is-ancestor HEAD origin/dogreader-oct22-update
          fi
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Restore and check original signing identity
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          test -n "$DOGREADER_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/certificate.txt
          grep -Fqi 'C5:CC:08:D9:75:7C:0E:92:89:3A:71:62:04:A2:6F:EB:61:57:F5:35:0A:00:DB:B0:B7:96:20:49:D6:D9:D1:77' /tmp/certificate.txt
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
      - name: Analyze
        run: flutter analyze --no-pub > /tmp/analysis.log 2>&1 || { tail -80 /tmp/analysis.log; exit 1; }
      - name: Run full Flutter regression suite
        timeout-minutes: 10
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded --timeout 90s 2>&1 | tee /tmp/tests.log
      - name: Build the requested original-app update once
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --no-pub --build-number "$BUILD_NUMBER" --dart-define="DOGREADER_BUILD=$BUILD_NUMBER" > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Verify signature, package and version; prepare download
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-certificates.txt
          grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/apk-certificates.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-identity.txt
          grep -Fq "package: name='com.example.audiobook_app' versionCode='$BUILD_NUMBER'" /tmp/apk-identity.txt
          mkdir -p dist
          cp "$APK" dist/Dogreader-${BUILD_NUMBER}.apk
          (cd dist && sha256sum Dogreader-${BUILD_NUMBER}.apk > SHA256SUMS)
          printf 'Dogreader Build %s\nSource: %s\nRun: %s/%s/actions/runs/%s\n\n' "$BUILD_NUMBER" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD.txt
          cat /tmp/analysis.log >> dist/BUILD.txt
          tail -1 /tmp/tests.log >> dist/BUILD.txt
          cat /tmp/apk-certificates.txt >> dist/BUILD.txt
          head -1 /tmp/apk-identity.txt >> dist/BUILD.txt
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Retain and verify a new GitHub Release; publish only when requested
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const number = process.env.BUILD_NUMBER;
            if (context.ref === 'refs/heads/fix/160-epub-narration' && number !== '160') throw new Error('This branch is authorized for build 160 only');
            if (context.ref === 'refs/heads/build/161-chapter-narration' && number !== '161') throw new Error('This branch is authorized for build 161 only');
            if (context.ref === 'refs/heads/build/162-narration-queue-reliability' && number !== '162') throw new Error('This branch is authorized for build 162 only');
            if (context.ref === 'refs/heads/build/163-chapter-panel-refinement' && number !== '163') throw new Error('This branch is authorized for build 163 only');
            if (context.ref === 'refs/heads/build/163-tts-cost-tracker' && number !== '163') throw new Error('This branch is authorized for build 163 only');
            if (context.ref === 'refs/heads/build/164-light-mode-cost-tracker' && number !== '164') throw new Error('This branch is authorized for build 164 only');
            if (context.ref === 'refs/heads/build/165-rss-offline-kokoro' && number !== '165') throw new Error('This branch is authorized for build 165 only');
            if (context.ref === 'refs/heads/build/166-ai-article-summaries' && number !== '166') throw new Error('This branch is authorized for build 166 only');
            if (context.ref === 'refs/heads/build/167-kokoro-decoder-fix' && number !== '167') throw new Error('This branch is authorized for build 167 only');
            const source = process.env.RELEASE_COMMIT;
            const tag = `v${number}`;
            const name = `Dogreader-${number}.apk`;
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})
            ]) {
              try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release/tag already exists; refusing replacement');
            }
            const apk = fs.readFileSync(`dist/${name}`);
            const sha256 = digest(apk);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const changelog = number === '167'
              ? 'Kokoro native BART G2P decoder alignment: aligns the Kokoro (Offline) native G2P decoder with vendored Misaki reference behavior by generating autoregressive decoder tokens until complete and filtering special tokens via vocabulary phonemes, preventing premature decoding stops on tokens 0, 3, or unexpected BOS; builds upon Build 166 AI Article Summaries and Summary Narration.\n\n'
              : number === '166'
              ? 'AI Article Summaries & Summary Narration: adds fully functional on-demand AI article summaries in Brief (~3-5 sentences), Standard (~200-350 words), and Detailed (~500-800 words) depths using Gemini Flash via the Dogreader Cloud backend; includes in-card generation progress, clear error/retry handling, paywall and preview extraction safeguards, local summary caching, and full summary narration through Google Chirp 3 HD, Kokoro (Cloud), and Kokoro (Offline) with separate audio versioning and playback progress that never collides with original article reading or listening.\n\n'
              : number === '165'
              ? 'RSS Feeds & Writers + Offline Kokoro integration: integrates the RSS Feeds & Writers collapsible shelf at the top of the main library (with traditional orange RSS icon, unread count badge, feed and followed writer counts, OPML import/export, author following, natural-language priority rules, full-article extraction/RSS fallback, and narration entry points) and integrates the on-device Kokoro FP32 + Misaki English narration engine directly into the standard Narration Engine dropdown as Kokoro (Offline) with local voices (Heart, Michael, Emma), complete chapter WAV generation in an isolated foreground service, model readiness/download controls, zero cloud configuration or billing requirements, and full preservation of Build 164 library and narration data.\n\n'
              : number === '164'
              ? 'Light mode refinement & Google Cloud TTS monthly cost tracker: improves the chapter list in light mode with a rich porcelain-lavender gradient, faint outer card border, refined top highlight, elevated ambient shadow, and shaded circular headphone buttons with soft dimensionality while strictly preserving dark mode; adds monthly TTS character usage & credit tracking (1M free-tier allowance + $10/month credit) without double-counting retries, live pre-generation cost estimates, one-tap Kokoro switching, and TTS Usage & Budget card in settings.\n\n'
              : number === '163'
              ? 'Chapter panel refinement: tighter chapter rows (96dp), more pronounced separators with a soft engraved highlight, a restrained surface sheen and card shadow, and softer 24dp outer corners. No narration, queue, storage or playback changes.\n\n'
              : number === '162'
              ? 'Reliable background narration queue submission & chapter-list UI refinements: fixes the _checkingBooks lock leak, moves waiting-job submission into the app-wide NarrationDelivery service so submissions continue across screen navigation and app restarts, increases the submission timeout for Cloud Run cold starts with idempotent retry on uncertain outcomes, clarifies Waiting to submit vs Queued status labels, and refines the chapter list with double-height rows (112dp), bolder chapter separators, active accent indicators, and photorealistic headphone artwork.\n\n'
              : number === '161'
              ? 'Compact chapter rows with separate reading and headphone controls. Long-press to select chapters, or generate narration for the whole book. The generation review skips existing recordings and active jobs.\n\n'
              : '';
            const body = `${changelog}Source: ${source}\nBuild: ${number}\nActions: ${run}\nAPK SHA-256: ${sha256}\nPackage: com.example.audiobook_app\nSigning certificate SHA-256: c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177\n\nInstall in place without uninstalling or clearing storage. Device validation is separate from CI checks.`;
            const release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: source,
              name: `Dogreader ${number}`, body, draft: true, make_latest: 'false'
            })).data;
            for (const filename of [name, 'SHA256SUMS', 'BUILD.txt']) {
              const data = fs.readFileSync(`dist/${filename}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: filename, data,
                headers: {'content-type': filename.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain', 'content-length': data.length}
              })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || data.length === 0) throw new Error('Incomplete release asset');
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
              if (digest(Buffer.from(downloaded.data)) !== digest(data)) throw new Error('Downloaded release asset hash mismatch');
            }
            let verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            if (verified.tag_name !== tag || verified.target_commitish !== source || !verified.draft) throw new Error('Release identity changed');
            if (process.env.PUBLISH === 'true') {
              verified = (await github.rest.repos.updateRelease({owner, repo, release_id: release.id, tag_name: tag, target_commitish: source, draft: false, make_latest: 'true'})).data;
              verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
              if (verified.draft) throw new Error('Release not published');
              const ref = (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data;
              if (ref.object.type !== 'commit' || ref.object.sha !== source) throw new Error('Published tag does not identify source');
            }
            const asset = verified.assets.find(a => a.name === name);
            if (!asset || asset.size !== apk.length || asset.state !== 'uploaded') throw new Error('Final APK missing');
            if (asset.digest && asset.digest !== `sha256:${sha256}`) throw new Error('Final APK digest differs');
            core.notice(`Verified ${verified.draft ? 'draft' : 'published'} release: ${verified.html_url}`);
            await core.summary.addHeading(`Dogreader ${number}: ${verified.draft ? 'verified draft; publication pending' : 'published'}`)
              .addLink('GitHub Release', verified.html_url)
              .addRaw(`\n\nSource: ${source}\n\nAPK SHA-256: ${sha256}\n`).write();

name: Release Dog Reader 2.0 experimental APK

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Reviewed experimental branch source SHA
        required: true
        type: string
      build_number:
        description: New unused sequential Android versionCode above all existing APKs
        required: true
        type: string
      publish:
        description: Publish after verification; false retains a draft for review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: dogreader-apk-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.ref == 'refs/heads/experimental/dog-reader-2-installation' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Require experimental branch, reviewed SHA and unused number
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const metadata = (await github.rest.repos.get({owner, repo})).data;
            if (metadata.default_branch !== 'dogreader-oct22-update' || context.ref !== 'refs/heads/experimental/dog-reader-2-installation') throw new Error('Experimental branch/default mismatch');
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect retained assets before a new explicitly authorized dispatch; do not rerun');
            if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error('Full lowercase source SHA required');
            const number = process.env.BUILD_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || Number(number) <= 135 || Number(number) > 2100000000) throw new Error('Invalid new Android versionCode');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            let highest = 135;
            for (const release of releases) {
              const values = [release.tag_name, ...release.assets.map(a => a.name)];
              for (const value of values) {
                const match = /^(?:v|dogreader-|build-|Dogreader-)([0-9]+)(?:$|[-.])/.exec(value);
                if (match) highest = Math.max(highest, Number(match[1]));
              }
            }
            for (const tag of tags) {
              const match = /^(?:v|dogreader-|build-)([0-9]+)(?:$|[-.])/.exec(tag.name);
              if (match) highest = Math.max(highest, Number(match[1]));
            }
            if (Number(number) !== highest + 1) throw new Error(`Next unused sequential version is ${highest + 1}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require integrated build-137 ancestry on the experimental branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor cdf4227dc6a966b20e24f61179ac953b22689024 HEAD
          git merge-base --is-ancestor eca7c65412c1c174557224b1522b7dbabfa559c7 HEAD
          git merge-base --is-ancestor HEAD origin/experimental/dog-reader-2-installation
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Restore and check original signing identity
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          test -n "$DOGREADER_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/certificate.txt
          grep -Fqi 'C5:CC:08:D9:75:7C:0E:92:89:3A:71:62:04:A2:6F:EB:61:57:F5:35:0A:00:DB:B0:B7:96:20:49:D6:D9:D1:77' /tmp/certificate.txt
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
      - name: Analyze
        run: flutter analyze --no-pub > /tmp/analysis.log 2>&1 || { tail -80 /tmp/analysis.log; exit 1; }
      - name: Reuse reviewed RSS regression evidence and verify protected code
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 497c619268be8d5c454955763e461013308301ce HEAD
          git diff --exit-code 497c619268be8d5c454955763e461013308301ce HEAD -- lib android pubspec.yaml pubspec.lock test tools
          git diff --exit-code 7ce8b93a1b06a4535c2336fb1d10953c61fffbb4 HEAD -- lib/main.dart lib/app_identity.dart lib/article_summary.dart lib/dogreader_audio_handler.dart lib/narration_dictionary.dart lib/narration_files.dart lib/narration_seek.dart android
          echo 'Reused 36 passing focused article/RSS cases from reviewed commit 497c619268be8d5c454955763e461013308301ce; tested application/test/tool source is unchanged.' > /tmp/tests.log
      - name: Experimental paid-operation and playback regressions
        run: |
          flutter test --no-pub --reporter expanded --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=true test/experimental_policy_test.dart test/experimental_queue_consent_test.dart test/session_lifecycle_test.dart test/system_media_controls_test.dart > /tmp/experimental-tests.log 2>&1 || { tail -100 /tmp/experimental-tests.log; exit 1; }
          flutter test --no-pub --reporter expanded --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=false --plain-name 'Substack shell falls back to its exact RSS entry and full encoded content' test/article_rss_test.dart > /tmp/rss-smoke.log 2>&1 || { tail -100 /tmp/rss-smoke.log; exit 1; }
          python3 -m unittest discover -s tools -p 'test_verify_experimental_apk.py'
      - name: Build Dog Reader 2.0 once
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --no-pub --build-number "$BUILD_NUMBER" --build-name 2.0.0 --dart-define="DOGREADER_BUILD=$BUILD_NUMBER" --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=false > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Verify signature, package, version and build-135 coexistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-certificates.txt
          grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/apk-certificates.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-identity.txt
          grep -Fq "package: name='com.example.audiobook_app.experimental' versionCode='$BUILD_NUMBER'" /tmp/apk-identity.txt
          grep -Fq "versionName='2.0.0'" /tmp/apk-identity.txt
          grep -Fq "application-label:'Dog Reader 2.0'" /tmp/apk-identity.txt
          mkdir -p /tmp/original-release
          gh release download v135 --repo "$GITHUB_REPOSITORY" --pattern Dogreader-135.apk --dir /tmp/original-release
          echo '48af8661b9287c225479a5dafb0a786b2c2fad4343f0b8d3b0bd432368351d1b  /tmp/original-release/Dogreader-135.apk' | sha256sum --check
          python3 tools/verify_experimental_apk.py "$BUILD_TOOLS/aapt" /tmp/original-release/Dogreader-135.apk "$APK" "$BUILD_NUMBER" > /tmp/isolation.txt
          mkdir -p dist
          cp "$APK" dist/Dogreader-${BUILD_NUMBER}-Dog-Reader-2.0.apk
          (cd dist && sha256sum Dogreader-${BUILD_NUMBER}-Dog-Reader-2.0.apk > SHA256SUMS)
          printf 'Dog Reader 2.0 Experimental Build %s\nSource: %s\nRun: %s/%s/actions/runs/%s\n\n' "$BUILD_NUMBER" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD.txt
          cat /tmp/analysis.log >> dist/BUILD.txt
          tail -1 /tmp/tests.log >> dist/BUILD.txt
          tail -1 /tmp/experimental-tests.log >> dist/BUILD.txt
          tail -1 /tmp/rss-smoke.log >> dist/BUILD.txt
          cat /tmp/isolation.txt >> dist/BUILD.txt
          cat /tmp/apk-certificates.txt >> dist/BUILD.txt
          cat /tmp/apk-identity.txt >> dist/BUILD.txt
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Retain and verify a new GitHub Release; publish only when requested
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const number = process.env.BUILD_NUMBER;
            const source = process.env.RELEASE_COMMIT;
            const tag = `v${number}-dog-reader-2.0`;
            const name = `Dogreader-${number}-Dog-Reader-2.0.apk`;
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})
            ]) {
              try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release/tag already exists; refusing replacement');
            }
            const apk = fs.readFileSync(`dist/${name}`);
            const sha256 = digest(apk);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Source: ${source}\nBuild: ${number}\nActions: ${run}\nAPK SHA-256: ${sha256}\nPackage: com.example.audiobook_app.experimental\nSigning certificate SHA-256: c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177\n\nIncludes pronunciation dictionary, HTML article import, public RSS/Atom fallback and article cleanup. Whole-book execution is out of scope and remains inaccessible. Live ACT acceptance and physical dual-app tests remain outstanding. Dog Reader 2.0 experimental app: installs separately from original Dogreader. Independent library, recordings, preferences and positions. One explicitly approved chapter or preview request at a time; batch/whole-book generation and AI summaries disabled. No backend deployment. APK manifest comparison verifies co-installation identities; physical dual-app/media-control acceptance remains separate.`;
            const release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: source,
              name: `Dog Reader 2.0 — Experimental build ${number}`, body, draft: true, prerelease: true, make_latest: 'false'
            })).data;
            for (const filename of [name, 'SHA256SUMS', 'BUILD.txt']) {
              const data = fs.readFileSync(`dist/${filename}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: filename, data,
                headers: {'content-type': filename.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain', 'content-length': data.length}
              })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || data.length === 0) throw new Error('Incomplete release asset');
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
              if (digest(Buffer.from(downloaded.data)) !== digest(data)) throw new Error('Downloaded release asset hash mismatch');
            }
            let verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            if (verified.tag_name !== tag || verified.target_commitish !== source || !verified.draft) throw new Error('Release identity changed');
            if (process.env.PUBLISH === 'true') {
              verified = (await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'})).data;
              verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
              if (verified.draft) throw new Error('Release not published');
              const ref = (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data;
              if (ref.object.type !== 'commit' || ref.object.sha !== source) throw new Error('Published tag does not identify source');
            }
            const asset = verified.assets.find(a => a.name === name);
            if (!asset || asset.size !== apk.length || asset.state !== 'uploaded') throw new Error('Final APK missing');
            if (asset.digest && asset.digest !== `sha256:${sha256}`) throw new Error('Final APK digest differs');
            core.notice(`Verified ${verified.draft ? 'draft' : 'published'} release: ${verified.html_url}`);
            await core.summary.addHeading(`Dog Reader 2.0 ${number}: ${verified.draft ? 'verified draft; publication pending' : 'published'}`)
              .addLink('GitHub Release', verified.html_url)
              .addRaw(`\n\nSource: ${source}\n\nAPK SHA-256: ${sha256}\n`).write();

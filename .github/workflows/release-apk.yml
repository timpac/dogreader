name: Release Dog Reader 2.0 experimental APK

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Reviewed experimental branch source SHA
        required: true
        type: string
      build_number:
        description: New unused sequential Android versionCode above all existing APKs
        required: true
        type: string
      retained_run:
        description: Optional failed run containing the exact retained APK (no APK rebuild)
        required: false
        type: string
        default: ''
      publish:
        description: Publish after verification; false retains a draft for review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: dogreader-apk-release
  cancel-in-progress: false

jobs:
  apk:
    if: github.ref == 'refs/heads/task/dogreader2-freepress-signin' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      RETAINED_RUN: ${{ inputs.retained_run }}
    steps:
      - name: Require experimental branch, reviewed SHA and unused number
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const metadata = (await github.rest.repos.get({owner, repo})).data;
            const allowedRefs = ['refs/heads/task/dogreader2-freepress-signin'];
            if (metadata.default_branch !== 'dogreader-oct22-update' || !allowedRefs.includes(context.ref)) throw new Error('Experimental branch/default mismatch');
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect retained assets before a new explicitly authorized dispatch; do not rerun');
            if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error('Full lowercase source SHA required');
            const number = process.env.BUILD_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || Number(number) <= 135 || Number(number) > 2100000000) throw new Error('Invalid new Android versionCode');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            let highest = 135;
            for (const release of releases) {
              const values = [release.tag_name, ...release.assets.map(a => a.name)];
              for (const value of values) {
                const match = /^(?:v|dogreader-|build-|Dogreader-)([0-9]+)(?:$|[-.])/.exec(value);
                if (match) highest = Math.max(highest, Number(match[1]));
              }
            }
            for (const tag of tags) {
              const match = /^(?:v|dogreader-|build-)([0-9]+)(?:$|[-.])/.exec(tag.name);
              if (match) highest = Math.max(highest, Number(match[1]));
            }
            if (Number(number) !== highest + 1) throw new Error(`Next unused sequential version is ${highest + 1}`);
            if (process.env.RETAINED_RUN) {
              if (process.env.RETAINED_RUN !== '44100702769' || number !== '158' || process.env.RELEASE_COMMIT !== 'a222bf363b68f86e3f5822f2f4d3ce475f00dd89') throw new Error('Unexpected retained APK identity');
              const previous = (await github.rest.actions.getWorkflowRun({owner, repo, run_id: Number(process.env.RETAINED_RUN)})).data;
              if (previous.head_sha !== process.env.RELEASE_COMMIT || previous.conclusion !== 'failure') throw new Error('Retained run/source mismatch');
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({owner, repo, run_id: previous.id})).data.jobs;
              for (const name of ['Analyze', 'Run DogReader 2.0 RSS experience and feed regression tests', 'Experimental paid-operation and playback regressions', 'Build Dog Reader 2.0 once']) {
                if (!jobs.some(job => job.steps.some(step => step.name === name && step.conclusion === 'success'))) throw new Error(`Missing retained evidence: ${name}`);
              }
              const artifact = (await github.rest.actions.getArtifact({owner, repo, artifact_id: 14336707718})).data;
              if (artifact.workflow_run.id !== previous.id || artifact.digest !== 'sha256:576ead1fd9bee0b910af37385e7a43834225ff47054995aa2a2ff2df03e446fb') throw new Error('Retained archive digest mismatch');
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require verified build-157 ancestry on the task branch
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          if [ -z "$RETAINED_RUN" ]; then
            test "$RELEASE_COMMIT" = "$GITHUB_SHA"
          else
            git diff --exit-code "$RELEASE_COMMIT" "$GITHUB_SHA" -- . ':!.github/workflows/release-apk.yml' ':!android/app/src/freepressAndroidTest'
            git checkout "$GITHUB_SHA" -- android/app/src/freepressAndroidTest
          fi
          git merge-base --is-ancestor 39f0f168306bdacc56644e2abb4cd2a9a538ce87 HEAD
      - name: Download immutable retained APK and original validation evidence
        if: inputs.retained_run != ''
        uses: actions/download-artifact@v4
        with:
          name: freepress-login-check-158-failure-evidence
          run-id: ${{ inputs.retained_run }}
          github-token: ${{ github.token }}
          path: /tmp/retained-evidence
      - name: Restore retained bytes (never recompile APK)
        if: inputs.retained_run != ''
        run: |
          mkdir -p build/app/outputs/flutter-apk
          cp /tmp/retained-evidence/home/runner/work/dogreader/dogreader/build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/app-debug.apk
          echo '194ace9323044d26986638a86276a9ead265400282aa032c5af9c93fabe21d91  build/app/outputs/flutter-apk/app-debug.apk' | sha256sum --check
          cp /tmp/retained-evidence/tmp/analysis.log /tmp/analysis.log
          cp /tmp/retained-evidence/tmp/tests.log /tmp/tests.log
          cp /tmp/retained-evidence/tmp/experimental-tests.log /tmp/experimental-tests.log
          cp /tmp/retained-evidence/tmp/build.log /tmp/build.log
          echo 'RSS smoke and APK verifier passed in original build run 44100702769; verified by original job step conclusion.' > /tmp/rss-smoke.log
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Restore and check original signing identity
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          test -n "$DOGREADER_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/certificate.txt
          grep -Fqi 'C5:CC:08:D9:75:7C:0E:92:89:3A:71:62:04:A2:6F:EB:61:57:F5:35:0A:00:DB:B0:B7:96:20:49:D6:D9:D1:77' /tmp/certificate.txt
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
      - name: Analyze
        if: inputs.retained_run == ''
        run: flutter analyze --no-pub > /tmp/analysis.log 2>&1 || { tail -80 /tmp/analysis.log; exit 1; }
      - name: Run DogReader 2.0 RSS experience and feed regression tests
        if: inputs.retained_run == ''
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e8f1fe2816973aaa26df37373431a46e6a210c30 HEAD
          flutter test --no-pub --reporter expanded --dart-define=DOGREADER_EXPERIMENTAL=true test/freepress_login_test.dart test/rss_experience_test.dart test/article_import_test.dart test/article_rss_test.dart > /tmp/tests.log 2>&1 || { tail -100 /tmp/tests.log; exit 1; }
      - name: Experimental paid-operation and playback regressions
        if: inputs.retained_run == ''
        run: |
          flutter test --no-pub --reporter expanded --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=true test/experimental_policy_test.dart test/experimental_queue_consent_test.dart test/article_https_test.dart test/session_lifecycle_test.dart test/system_media_controls_test.dart > /tmp/experimental-tests.log 2>&1 || { tail -100 /tmp/experimental-tests.log; exit 1; }
          flutter test --no-pub --reporter expanded --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=false --plain-name 'Substack shell falls back to its exact RSS entry and full encoded content' test/article_rss_test.dart > /tmp/rss-smoke.log 2>&1 || { tail -100 /tmp/rss-smoke.log; exit 1; }
          python3 -m unittest discover -s tools -p 'test_verify_experimental_apk.py'
      - name: Build Dog Reader 2.0 once
        if: inputs.retained_run == ''
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --no-pub --build-number "$BUILD_NUMBER" --build-name 2.0.0 --dart-define="DOGREADER_BUILD=$BUILD_NUMBER" --dart-define=DOGREADER_EXPERIMENTAL=true --dart-define=DOGREADER_ENABLE_ARTICLE_SUMMARIES=false > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Set up the pinned Gradle version for native test assembly
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: true
      - name: Assemble native policy tests without rebuilding the retained APK
        working-directory: android
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\nflutter.versionName=2.0.0\nflutter.versionCode=%s\nflutter.buildMode=debug\n' "$ANDROID_HOME" "$FLUTTER_ROOT" "$BUILD_NUMBER" > local.properties
          sha256sum ../build/app/outputs/flutter-apk/app-debug.apk > /tmp/retained-apk.sha256
          gradle :app:assembleDebugAndroidTest -Pdart-defines=RE9HUkVBREVSX0VYUEVSSU1FTlRBTD10cnVl > /tmp/native-assembly.log 2>&1 || { tail -100 /tmp/native-assembly.log; exit 1; }
          sha256sum --check /tmp/retained-apk.sha256
      - name: Enable emulator acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Native policy and private-manifest checks (no accounts or site traffic)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb install -r build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class com.example.audiobook_app.FreePressPolicyTest com.example.audiobook_app.experimental.runner/androidx.test.runner.AndroidJUnitRunner > /tmp/freepress-native-tests.log
            cat /tmp/freepress-native-tests.log
            grep -F 'OK (2 tests)' /tmp/freepress-native-tests.log
      - name: Verify signature, package, version and build-135 coexistence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-certificates.txt
          grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/apk-certificates.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-identity.txt
          grep -Fq "package: name='com.example.audiobook_app.experimental' versionCode='$BUILD_NUMBER'" /tmp/apk-identity.txt
          grep -Fq "versionName='2.0.0'" /tmp/apk-identity.txt
          grep -Fq "application-label:'Dog Reader 2.0'" /tmp/apk-identity.txt
          mkdir -p /tmp/original-release
          gh release download v135 --repo "$GITHUB_REPOSITORY" --pattern Dogreader-135.apk --dir /tmp/original-release
          echo '48af8661b9287c225479a5dafb0a786b2c2fad4343f0b8d3b0bd432368351d1b  /tmp/original-release/Dogreader-135.apk' | sha256sum --check
          python3 tools/verify_experimental_apk.py "$BUILD_TOOLS/aapt" /tmp/original-release/Dogreader-135.apk "$APK" "$BUILD_NUMBER" > /tmp/isolation.txt
          mkdir -p dist
          cp "$APK" dist/Dogreader-${BUILD_NUMBER}-Dog-Reader-2.0.apk
          (cd dist && sha256sum Dogreader-${BUILD_NUMBER}-Dog-Reader-2.0.apk > SHA256SUMS)
          printf 'Dog Reader 2.0 Experimental Build %s\nSource: %s\nRun: %s/%s/actions/runs/%s\n\n' "$BUILD_NUMBER" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD.txt
          printf 'APK originally compiled in run: %s\nVerification workflow SHA: %s\n\n' "${RETAINED_RUN:-$GITHUB_RUN_ID}" "$GITHUB_SHA" >> dist/BUILD.txt
          cat /tmp/analysis.log >> dist/BUILD.txt
          tail -1 /tmp/tests.log >> dist/BUILD.txt
          tail -1 /tmp/experimental-tests.log >> dist/BUILD.txt
          tail -1 /tmp/rss-smoke.log >> dist/BUILD.txt
          cat /tmp/freepress-native-tests.log >> dist/BUILD.txt
          cat /tmp/isolation.txt >> dist/BUILD.txt
          cp docs/FREEPRESS_LOGIN_CHECK.md dist/FREEPRESS_LOGIN_CHECK.md
          cat /tmp/apk-certificates.txt >> dist/BUILD.txt
          cat /tmp/apk-identity.txt >> dist/BUILD.txt
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Retain and verify a new GitHub Release; publish only when requested
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const number = process.env.BUILD_NUMBER;
            const source = process.env.RELEASE_COMMIT;
            const tag = `v${number}-dog-reader-2.0`;
            const name = `Dogreader-${number}-Dog-Reader-2.0.apk`;
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})
            ]) {
              try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release/tag already exists; refusing replacement');
            }
            const apk = fs.readFileSync(`dist/${name}`);
            const sha256 = digest(apk);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Source: ${source}\nBuild: ${number}\nActions: ${run}\nAPK SHA-256: ${sha256}\nPackage: com.example.audiobook_app.experimental\nSigning certificate SHA-256: c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177\n\nLOGIN FEASIBILITY CHECK ONLY. Adds a device-local Android embedded browser for The Free Press / Substack sign-in. Chrome sessions are separate. Open Settings → The Free Press: test sign-in. Enter credentials only inside the app. Verify a paid article opens, then close/reopen DogReader and check access again. Report only the outcome and any visible non-secret error; never send passwords, codes, cookies or sign-in links. Full signed-in article import is pending this device test. No PDF fallback selected.\n\nWebView debugging is disabled, console output is suppressed, no JavaScript bridge or session export exists, and WebView profile directories are excluded from cloud backup and device transfer. Sign-in is performed directly with the publisher. Forget login clears only embedded-browser site storage. Existing RSS discovery, subscriptions, libraries, positions, narration and downloaded audio formats are unchanged. This is an in-place update to build 157 (same experimental package and signing identity); do not uninstall or clear storage. Unit/regression and offline Android policy tests are included in BUILD.txt. Actual subscriber login reliability is not yet established. No production merge or backend deployment.`;
            const release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: source,
              name: `Dog Reader 2.0 — Experimental build ${number}`, body, draft: true, prerelease: true, make_latest: 'false'
            })).data;
            for (const filename of [name, 'SHA256SUMS', 'BUILD.txt', 'FREEPRESS_LOGIN_CHECK.md']) {
              const data = fs.readFileSync(`dist/${filename}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: filename, data,
                headers: {'content-type': filename.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain', 'content-length': data.length}
              })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || data.length === 0) throw new Error('Incomplete release asset');
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
              if (digest(Buffer.from(downloaded.data)) !== digest(data)) throw new Error('Downloaded release asset hash mismatch');
            }
            let verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            if (verified.tag_name !== tag || verified.target_commitish !== source || !verified.draft) throw new Error('Release identity changed');
            if (process.env.PUBLISH === 'true') {
              verified = (await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'})).data;
              verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
              if (verified.draft) throw new Error('Release not published');
              const ref = (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data;
              if (ref.object.type !== 'commit' || ref.object.sha !== source) throw new Error('Published tag does not identify source');
            }
            const asset = verified.assets.find(a => a.name === name);
            if (!asset || asset.size !== apk.length || asset.state !== 'uploaded') throw new Error('Final APK missing');
            if (asset.digest && asset.digest !== `sha256:${sha256}`) throw new Error('Final APK digest differs');
            core.notice(`Verified ${verified.draft ? 'draft' : 'published'} release: ${verified.html_url}`);
            await core.summary.addHeading(`Dog Reader 2.0 ${number}: ${verified.draft ? 'verified draft; publication pending' : 'published'}`)
              .addLink('GitHub Release', verified.html_url)
              .addRaw(`\n\nSource: ${source}\n\nAPK SHA-256: ${sha256}\n`).write();
      - name: Retain APK and verification evidence if a later step fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: freepress-login-check-${{ inputs.build_number }}-failure-evidence
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            /tmp/analysis.log
            /tmp/tests.log
            /tmp/experimental-tests.log
            /tmp/native-assembly.log
            /tmp/freepress-native-tests.log
            /tmp/build.log
          retention-days: 7

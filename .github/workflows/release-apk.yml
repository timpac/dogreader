name: Release Dogreader APK

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Reviewed full source SHA on the isolated audio-controls branch
        required: true
        type: string
      build_number:
        description: New unused sequential Android versionCode above all existing APKs
        required: true
        type: string
      publish:
        description: Publish after verification; false retains a draft for review
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: dogreader-apk-release
  cancel-in-progress: false

jobs:
  native:
    if: github.ref == 'refs/heads/fix/audio-controls-142' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ORG_GRADLE_PROJECT_dogreaderTestBuild: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check isolated source
        env:
          SOURCE: ${{ inputs.release_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor eca7c65412c1c174557224b1522b7dbabfa559c7 HEAD
          git merge-base --is-ancestor HEAD origin/fix/audio-controls-142
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Reuse verified Dart regressions and upstream baseline for unchanged runtime
        run: |
          # Run 43111278083 passed analysis/full Flutter suite and reproduced the
          # upstream listener-null defect. Only test harness/docs/workflow changed.
          git diff --exit-code 281ff123f2ded32e62c6b993977d32b0d109f303 -- lib test pubspec.yaml pubspec.lock third_party android/app/src/main android/app/build.gradle.kts analysis_options.yaml
          flutter pub get --enforce-lockfile > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
          echo 'Reused passing Flutter regressions and native baseline from run 43111278083; runtime/source equality verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Build unchanged repaired probe and corrected instrumentation
        run: |
          flutter build apk --debug --no-pub --target-platform android-x64 --target test/support/media_control_probe.dart --build-number 142 > /tmp/probe-build.log 2>&1 || { tail -80 /tmp/probe-build.log; exit 1; }
          cp build/app/outputs/flutter-apk/app-debug.apk /tmp/repaired-probe.apk
          cd android
          ./gradlew app:assembleDebugAndroidTest -Ptarget="$GITHUB_WORKSPACE/test/support/media_control_probe.dart" -Ptarget-platform=android-x64 > /tmp/instrumentation-build.log 2>&1 || { tail -80 /tmp/instrumentation-build.log; exit 1; }
          cp ../build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk /tmp/instrumentation.apk
          ./gradlew --stop
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/check_android_media_controls.py --case recreation --apk /tmp/repaired-probe.apk --instrumentation-apk /tmp/instrumentation.apk --report /tmp/recreation-native-report.json
            python3 tools/check_android_media_controls.py --case controls --apk /tmp/repaired-probe.apk --instrumentation-apk /tmp/instrumentation.apk --report /tmp/controls-native-report.json
      - name: Retain bounded native reports in job summary
        if: always()
        run: |
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              for report in sorted(Path('/tmp').glob('*-native-report.json')):
                  data = report.read_text()
                  print(f'NATIVE_REPORT {report.name} {data}', flush=True)
                  summary.write(f'### {report.name}\n\n```json\n{data}\n```\n\n')
          PYREPORT
  apk:
    needs: native
    if: github.ref == 'refs/heads/fix/audio-controls-142' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    steps:
      - name: Require canonical branch, reviewed SHA and unused number
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const metadata = (await github.rest.repos.get({owner, repo})).data;
            if (metadata.default_branch !== 'dogreader-oct22-update' || context.ref !== 'refs/heads/fix/audio-controls-142') throw new Error('Canonical branch mismatch');
            if (Number(process.env.GITHUB_RUN_ATTEMPT) !== 1) throw new Error('Inspect retained assets before a new explicitly authorized dispatch; do not rerun');
            if (!/^[0-9a-f]{40}$/.test(process.env.RELEASE_COMMIT)) throw new Error('Full lowercase source SHA required');
            const number = process.env.BUILD_NUMBER;
            if (!/^[1-9][0-9]*$/.test(number) || Number(number) <= 135 || Number(number) > 2100000000) throw new Error('Invalid new Android versionCode');
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            let highest = 135;
            for (const release of releases) {
              const values = [release.tag_name, ...release.assets.map(a => a.name)];
              for (const value of values) {
                const match = /^(?:v|dogreader-|build-|Dogreader-)([0-9]+)(?:$|[-.])/.exec(value);
                if (match) highest = Math.max(highest, Number(match[1]));
              }
            }
            for (const tag of tags) {
              const match = /^(?:v|dogreader-|build-)([0-9]+)(?:$|[-.])/.exec(tag.name);
              if (match) highest = Math.max(highest, Number(match[1]));
            }
            if (Number(number) !== highest + 1) throw new Error(`Next unused sequential version is ${highest + 1}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require complete build-135 and canonical branch ancestry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          git merge-base --is-ancestor cdf4227dc6a966b20e24f61179ac953b22689024 HEAD
          git merge-base --is-ancestor HEAD origin/fix/audio-controls-142
      - name: Free unused runner disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - name: Restore and check original signing identity
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          test -n "$DOGREADER_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey > /tmp/certificate.txt
          grep -Fqi 'C5:CC:08:D9:75:7C:0E:92:89:3A:71:62:04:A2:6F:EB:61:57:F5:35:0A:00:DB:B0:B7:96:20:49:D6:D9:D1:77' /tmp/certificate.txt
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
      - name: Record prerequisite verification
        run: |
          printf 'Analysis and full Flutter suite passed in the native prerequisite for %s\n' "$RELEASE_COMMIT" > /tmp/analysis.log
          printf 'Full Flutter regression suite passed in the native prerequisite\n' > /tmp/tests.log
      - name: Build the requested original-app update once
        env:
          ORG_GRADLE_PROJECT_dogreaderOriginalUpdate: 'true'
        run: flutter build apk --debug --no-pub --build-number "$BUILD_NUMBER" --dart-define="DOGREADER_BUILD=$BUILD_NUMBER" > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Verify signature, package and version; prepare download
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=build/app/outputs/flutter-apk/app-debug.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-certificates.txt
          grep -Fqi 'c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177' /tmp/apk-certificates.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-identity.txt
          grep -Fq "package: name='com.example.audiobook_app' versionCode='$BUILD_NUMBER'" /tmp/apk-identity.txt
          mkdir -p dist
          cp "$APK" dist/Dogreader-${BUILD_NUMBER}.apk
          (cd dist && sha256sum Dogreader-${BUILD_NUMBER}.apk > SHA256SUMS)
          printf 'Dogreader Build %s\nSource: %s\nRun: %s/%s/actions/runs/%s\n\n' "$BUILD_NUMBER" "$RELEASE_COMMIT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD.txt
          cat /tmp/analysis.log >> dist/BUILD.txt
          tail -1 /tmp/tests.log >> dist/BUILD.txt
          cat /tmp/apk-certificates.txt >> dist/BUILD.txt
          head -1 /tmp/apk-identity.txt >> dist/BUILD.txt
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Retain and verify a new GitHub Release; publish only when requested
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const {owner, repo} = context.repo;
            const number = process.env.BUILD_NUMBER;
            const source = process.env.RELEASE_COMMIT;
            const tag = `v${number}`;
            const name = `Dogreader-${number}.apk`;
            const digest = bytes => crypto.createHash('sha256').update(bytes).digest('hex');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})
            ]) {
              try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
              throw new Error('Release/tag already exists; refusing replacement');
            }
            const apk = fs.readFileSync(`dist/${name}`);
            const sha256 = digest(apk);
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `Repairs audio_service native listener ownership across service recreation while its Flutter engine survives. Preserves the narration player, sources and saved positions. Includes separate native/Dart diagnostic events. Verified by the native prerequisite (upstream failure reproduction, repaired service recreation, System UI controls and extended paused resumption). Physical Pixel and Bluetooth acceptance remains outstanding.\n\nSource: ${source}\nBuild: ${number}\nActions: ${run}\nAPK SHA-256: ${sha256}\nPackage: com.example.audiobook_app\nSigning certificate SHA-256: c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177\n\nInstall in place without uninstalling or clearing storage. Device validation is separate from CI checks.`;
            const release = (await github.rest.repos.createRelease({
              owner, repo, tag_name: tag, target_commitish: source,
              name: `Dogreader ${number}`, body, draft: true, make_latest: 'false'
            })).data;
            for (const filename of [name, 'SHA256SUMS', 'BUILD.txt']) {
              const data = fs.readFileSync(`dist/${filename}`);
              const asset = (await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: filename, data,
                headers: {'content-type': filename.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain', 'content-length': data.length}
              })).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || data.length === 0) throw new Error('Incomplete release asset');
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
              if (digest(Buffer.from(downloaded.data)) !== digest(data)) throw new Error('Downloaded release asset hash mismatch');
            }
            let verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            if (verified.tag_name !== tag || verified.target_commitish !== source || !verified.draft) throw new Error('Release identity changed');
            if (process.env.PUBLISH === 'true') {
              verified = (await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, make_latest: 'true'})).data;
              verified = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
              if (verified.draft) throw new Error('Release not published');
              const ref = (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data;
              if (ref.object.type !== 'commit' || ref.object.sha !== source) throw new Error('Published tag does not identify source');
            }
            const asset = verified.assets.find(a => a.name === name);
            if (!asset || asset.size !== apk.length || asset.state !== 'uploaded') throw new Error('Final APK missing');
            if (asset.digest && asset.digest !== `sha256:${sha256}`) throw new Error('Final APK digest differs');
            core.notice(`Verified ${verified.draft ? 'draft' : 'published'} release: ${verified.html_url}`);
            await core.summary.addHeading(`Dogreader ${number}: ${verified.draft ? 'verified draft; publication pending' : 'published'}`)
              .addLink('GitHub Release', verified.html_url)
              .addRaw(`\n\nSource: ${source}\n\nAPK SHA-256: ${sha256}\n`).write();

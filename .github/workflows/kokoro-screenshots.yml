name: Kokoro control screenshots
on:
  push:
    branches: [docs/kokoro-control-screenshots-130]
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: false
      - run: flutter pub get --enforce-lockfile
      - run: flutter test --update-goldens test/narration_screenshots_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-control-screenshots-130
          path: test/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

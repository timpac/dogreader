name: Isolated Kokoro prototype APK

# Called only by an explicit manual dispatch of release-apk.yml on the feature
# branch. No push, pull_request, tag, schedule, or production deployment trigger.
on:
  workflow_call:
    inputs:
      release_commit:
        required: true
        type: string
      build_number:
        required: true
        type: string
      publish:
        required: true
        type: boolean
    secrets:
      DOGREADER_KEYSTORE_B64:
        required: true

permissions:
  contents: read

jobs:
  probe:
    if: github.ref == 'refs/heads/feature/local-kokoro-feasibility' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      SOURCE: ${{ inputs.release_commit }}
      BUILD_NUMBER: ${{ inputs.build_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Require exact reviewed feature tip and next unused global number
        uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/feature/local-kokoro-feasibility') throw Error('Wrong branch');
            if (process.env.GITHUB_RUN_ATTEMPT !== '1') throw Error('Inspect retained assets before another explicit dispatch');
            if (!/^[a-f0-9]{40}$/.test(process.env.SOURCE) || context.sha !== process.env.SOURCE) throw Error('Reviewed source must equal this feature tip');
            const {owner, repo} = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            const tags = await github.paginate(github.rest.repos.listTags, {owner, repo, per_page: 100});
            let highest = 135;
            const names = [...tags.map(x => x.name), ...releases.flatMap(x => [x.tag_name, ...x.assets.map(a => a.name)])];
            for (const name of names) {
              const m = /^(?:v|dogreader-|build-|Dogreader-)([0-9]+)(?:$|[-.])/.exec(name);
              if (m) highest = Math.max(highest, Number(m[1]));
            }
            if (process.env.BUILD_NUMBER !== String(highest + 1)) throw Error(`Next unused build is ${highest + 1}`);
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check provenance and isolation
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          git merge-base --is-ancestor 30e92ca871bad697b19637488b085a8ecd03f1a3 HEAD
          git diff --exit-code 30e92ca871bad697b19637488b085a8ecd03f1a3 HEAD -- lib android pubspec.yaml pubspec.lock third_party test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare standalone Android template and original signing key
        env:
          DOGREADER_KEYSTORE_B64: ${{ secrets.DOGREADER_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$DOGREADER_KEYSTORE_B64"
          mkdir -p "$HOME/.android"
          printf '%s' "$DOGREADER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          cd experiments/kokoro_probe
          flutter create --no-pub --platforms android --org com.dogreader --project-name kokoro_probe . > /tmp/template.log 2>&1
          rm -f test/widget_test.dart
          python3 tool/configure_android.py
          flutter pub get > /tmp/dependencies.log 2>&1 || { tail -60 /tmp/dependencies.log; exit 1; }
      - name: Targeted analysis and frontend safeguards
        working-directory: experiments/kokoro_probe
        run: |
          flutter analyze --no-pub lib test > /tmp/analysis.log 2>&1 || { cat /tmp/analysis.log; exit 1; }
          flutter test --no-pub test/frontend_test.dart > /tmp/tests.log 2>&1 || { cat /tmp/tests.log; exit 1; }
      - name: Build one ARM64 AOT prototype APK without any model binaries
        working-directory: experiments/kokoro_probe
        run: |
          flutter build apk --release --no-pub --target-platform android-arm64 --build-number "$BUILD_NUMBER" --dart-define="DOGREADER_BUILD=$BUILD_NUMBER" > /tmp/build.log 2>&1 || { tail -100 /tmp/build.log; exit 1; }
      - name: Verify identity, signature and 16 KB native alignment
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=experiments/kokoro_probe/build/app/outputs/flutter-apk/app-release.apk
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > /tmp/apk-cert.txt
          grep -Fqi c5cc08d9757c0e92893a716204a26feb6157f5350a00dbb0b7962049d6d9d177 /tmp/apk-cert.txt
          "$TOOLS/aapt" dump badging "$APK" > /tmp/apk-identity.txt
          grep -Fq "package: name='com.dogreader.kokoro_probe' versionCode='$BUILD_NUMBER'" /tmp/apk-identity.txt
          "$TOOLS/zipalign" -c -P 16 -v 4 "$APK" > /tmp/alignment.txt
          python3 experiments/kokoro_probe/tool/verify_apk.py "$APK"
          mkdir -p dist
          cp "$APK" "dist/Dogreader-${BUILD_NUMBER}-Kokoro-Offline-Probe.apk"
          cp experiments/kokoro_probe/pubspec.lock dist/prototype-pubspec.lock
          cp docs/LOCAL_KOKORO_FEASIBILITY.md dist/FEASIBILITY.md
          cp experiments/kokoro_probe/LICENSES.txt dist/LICENSES.txt
          curl -fsSL https://raw.githubusercontent.com/k2-fsa/sherpa-onnx/v2.0.1/LICENSE >> dist/LICENSES.txt
          curl -fsSL https://raw.githubusercontent.com/microsoft/onnxruntime/v1.28.2/LICENSE >> dist/LICENSES.txt
          curl -fsSL https://raw.githubusercontent.com/microsoft/onnxruntime/v1.28.2/ThirdPartyNotices.txt >> dist/LICENSES.txt
          printf 'Experimental Dogreader Kokoro probe %s\nSource: %s\nRun: %s/%s/actions/runs/%s\nPackage: com.dogreader.kokoro_probe\nARM64 release/AOT. No Android inference or Pixel measurements performed in CI.\n' "$BUILD_NUMBER" "$SOURCE" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > dist/BUILD.txt
          cat /tmp/analysis.log /tmp/tests.log /tmp/apk-cert.txt >> dist/BUILD.txt
          head -1 /tmp/apk-identity.txt >> dist/BUILD.txt
          (cd dist && sha256sum *.apk prototype-pubspec.lock FEASIBILITY.md LICENSES.txt BUILD.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro-probe-${{ inputs.build_number }}
          path: dist/
          retention-days: 14
      - name: Retain, download-verify and publish numbered experimental release
        uses: actions/github-script@v7
        env:
          PUBLISH: ${{ inputs.publish }}
        with:
          script: |
            const fs = require('fs'), crypto = require('crypto');
            const {owner, repo} = context.repo;
            const number = process.env.BUILD_NUMBER, source = process.env.SOURCE;
            const tag = `v${number}-kokoro-offline`;
            const name = `Dogreader-${number}-Kokoro-Offline-Probe.apk`;
            const digest = data => crypto.createHash('sha256').update(data).digest('hex');
            for (const request of [
              () => github.rest.repos.getReleaseByTag({owner, repo, tag}),
              () => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})
            ]) {
              try { await request(); } catch (error) { if (error.status === 404) continue; throw error; }
              throw Error('Release/tag already exists. Never overwrite.');
            }
            const body = `Isolated offline feasibility prototype; installs beside Dogreader as Kokoro Offline Probe (com.dogreader.kokoro_probe).\n\nOpen Assets and install ${name}. Download the model once (132.4 MB), then enable airplane mode and disable Wi-Fi. Use af_heart, two threads, one run for the first 1,000-word test. Tap Play latest WAV and Save measurements. See FEASIBILITY.md for the Pixel procedure and limitations. Unknown words are rejected.\n\nSource: ${source}\nAPK SHA-256: ${digest(fs.readFileSync('dist/' + name))}\n\nPixel inference, speed, RAM, heat and battery remain unmeasured. Existing Dogreader app and Google Cloud unchanged. No merge. Native/runtime license notices and dependency lockfile are attached. Source and build recipe are at this release tag. Downloads are public and require no API key.`;
            const release = (await github.rest.repos.createRelease({owner, repo, tag_name: tag,
              target_commitish: source, name: `Dogreader ${number} — Kokoro offline experiment`,
              body, draft: true, prerelease: true, make_latest: 'false'})).data;
            for (const filename of fs.readdirSync('dist')) {
              const data = fs.readFileSync('dist/' + filename);
              const asset = (await github.rest.repos.uploadReleaseAsset({owner, repo, release_id: release.id,
                name: filename, data, headers: {'content-type': filename.endsWith('.apk') ? 'application/vnd.android.package-archive' : 'text/plain', 'content-length': data.length}})).data;
              if (asset.state !== 'uploaded' || asset.size !== data.length || !asset.size) throw Error('Incomplete upload');
              const downloaded = await github.rest.repos.getReleaseAsset({owner, repo, asset_id: asset.id, headers: {accept: 'application/octet-stream'}});
              if (digest(Buffer.from(downloaded.data)) !== digest(data)) throw Error('Downloaded asset hash mismatch');
            }
            if (process.env.PUBLISH === 'true') await github.rest.repos.updateRelease({owner, repo, release_id: release.id, draft: false, prerelease: true, make_latest: 'false'});
            const final = (await github.rest.repos.getRelease({owner, repo, release_id: release.id})).data;
            if (!final.assets.find(a => a.name === name && a.size > 0 && a.state === 'uploaded')) throw Error('Final APK missing');
            if (process.env.PUBLISH === 'true' && final.draft) throw Error('Still a draft');
            if (!final.draft) {
              const ref = (await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`})).data;
              if (ref.object.sha !== source || ref.object.type !== 'commit') throw Error('Tag/source mismatch');
            }
            await core.summary.addLink('Experimental GitHub Release', final.html_url).write();
